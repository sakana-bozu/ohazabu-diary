<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>オハザブ日記</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      background: #ffffff;
      color: #000000;
    }

    body {
      font-family: "Yu Gothic", "游ゴシック", YuGothic, sans-serif;
      min-height: 100vh;
    }

    /* 左上のタイトル */
    header {
      padding: 28px 32px;
    }

    .site-title {
      margin: 0;
      color: #003B75;
      font-family: "Yu Gothic", "游ゴシック", YuGothic, sans-serif;
      font-size: 22px;
      font-weight: normal;
      letter-spacing: 0;
    }

    /* 日記一覧 */
    main {
      padding: 30px 32px 180px;
    }

    .entry {
      margin-bottom: 45px;
    }

    .date {
      margin-bottom: 6px;
      color: #000000;
      font-family: "Yu Mincho", "游明朝", YuMincho, serif;
      font-size: 17px;
      font-weight: normal;
    }

    .entry-title {
      color: #000000;
      font-family: "Yu Gothic", "游ゴシック", YuGothic, sans-serif;
      font-size: 20px;
      font-weight: normal;
      text-decoration: none;
    }

    .entry-title:hover {
      text-decoration: underline;
    }

    /* 画面下のナビゲーション */
    .navigation-background {
      position: fixed;
      left: 0;
      right: 0;
      bottom: 0;
      height: 110px;
      background: #ffffff;
      z-index: 10;
    }

    .navigation {
      position: fixed;
      left: 0;
      right: 0;
      bottom: 0;
      height: 110px;
      padding: 0 32px 28px;
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      z-index: 11;
      pointer-events: none;
    }

    .navigation a {
      color: #000000;
      font-family: "Yu Gothic", "游ゴシック", YuGothic, sans-serif;
      font-size: 17px;
      font-weight: normal;
      text-decoration: none;
      pointer-events: auto;
    }

    .navigation a:hover {
      text-decoration: underline;
    }

    @media (max-width: 600px) {
      header {
        padding: 22px 20px;
      }

      main {
        padding: 25px 20px 160px;
      }

      .site-title {
        font-size: 20px;
      }

      .date {
        font-size: 16px;
      }

      .entry-title {
        font-size: 19px;
      }

      .navigation-background {
        height: 95px;
      }

      .navigation {
        height: 95px;
        padding: 0 20px 22px;
      }

      .navigation a {
        font-size: 16px;
      }
    }
  </style>
</head>

<body>

  <header>
    <h1 class="site-title">オハザブ日記</h1>
  </header>

  <main>

    <article class="entry">
      <div class="date">20261007</div>
      <a class="entry-title" href="20261007.html">今日の日記</a>
    </article>

  </main>

  <!-- 投稿と重ならないよう、画面下部を白く確保 -->
  <div class="navigation-background"></div>

  <nav class="navigation">
    <a href="20261006.html">←きのう</a>
    <a href="20261008.html">あした→</a>
  </nav>

</body>
</html>

<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>オハザブ日記</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      background: #ffffff;
      color: #000000;
    }

    body {
      font-family: "Yu Gothic", "游ゴシック", YuGothic, sans-serif;
      font-weight: 500;
    }

    /* 全体の横幅 */
    .page {
      width: calc(100% - 40px);
      max-width: 900px;
      margin: 0 auto;
      min-height: 100vh;
      position: relative;
    }

    /* 上部 */
    header {
      position: relative;
      padding-top: 28px;
      padding-bottom: 70px;
    }

    .site-title {
      margin: 0;
      color: #003B75;
      font-family: "Yu Gothic", "游ゴシック", YuGothic, sans-serif;
      font-size: 28px;
      font-weight: 600;
      line-height: 1.4;
    }

    /* 三本線 */
    .menu-button {
      position: absolute;
      top: 25px;
      right: 0;
      width: 34px;
      height: 34px;
      padding: 5px 0;
      border: none;
      background: transparent;
      color: #003B75;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: center;
    }

    .menu-button span {
      display: block;
      width: 28px;
      height: 2px;
      background: #003B75;
    }

    /* 日記 */
    main {
      padding-bottom: 130px;
    }

    .date {
      margin: 0 0 18px 0;
      font-family: "Yu Mincho", "游明朝", YuMincho, serif;
      font-size: 21px;
      font-weight: 400;
      line-height: 1.5;
      color: #000000;
    }

    .diary {
      font-family: "Yu Gothic", "游ゴシック", YuGothic, sans-serif;
      font-size: 21px;
      font-weight: 500;
      line-height: 1.9;
      color: #000000;
    }

    .diary p {
      margin: 0 0 1.5em 0;
    }

    .diary img {
      display: block;
      width: 100%;
      height: auto;
      margin: 30px 0;
    }

    /* 下部ナビ */
    .bottom-area {
      position: fixed;
      z-index: 20;
      left: 0;
      right: 0;
      bottom: 0;

      background: #ffffff;
      padding: 20px 0 25px;
    }

    .bottom-nav {
      width: calc(100% - 40px);
      max-width: 900px;
      margin: 0 auto;

      display: flex;
      justify-content: space-between;
      align-items: center;

      font-family: "Yu Gothic", "游ゴシック", YuGothic, sans-serif;
      font-size: 18px;
      font-weight: 500;
    }

    .bottom-nav a {
      color: #003B75;
      text-decoration: none;
    }

    /* メニュー画面 */
    .menu-screen {
      position: fixed;
      z-index: 100;
      inset: 0;

      background: #ffffff;

      display: none;
    }

    .menu-screen.open {
      display: block;
    }

    .menu-inner {
      width: calc(100% - 40px);
      max-width: 900px;
      min-height: 100vh;
      margin: 0 auto;

      position: relative;

      display: flex;
      justify-content: center;
      align-items: center;
    }

    .menu-list {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 28px;

      font-family: "Yu Gothic", "游ゴシック", YuGothic, sans-serif;
      font-size: 28px;
      font-weight: 500;
    }

    .menu-list a {
      color: #003B75;
      text-decoration: none;
    }

    /* メニューを開いているときの× */
    .close-button {
      position: absolute;
      top: 25px;
      right: 0;

      width: 34px;
      height: 34px;

      padding: 0;
      border: none;
      background: transparent;
      cursor: pointer;
    }

    .close-button::before,
    .close-button::after {
      content: "";
      position: absolute;
      top: 16px;
      left: 3px;

      width: 28px;
      height: 2px;
      background: #003B75;
    }

    .close-button::before {
      transform: rotate(45deg);
    }

    .close-button::after {
      transform: rotate(-45deg);
    }

    /* スマホ */
    @media (max-width: 600px) {

      .page {
        width: calc(100% - 32px);
      }

      header {
        padding-top: 22px;
        padding-bottom: 55px;
      }

      .site-title {
        font-size: 25px;
      }

      .menu-button {
        top: 20px;
      }

      .date {
        font-size: 19px;
      }

      .diary {
        font-size: 19px;
        line-height: 1.9;
      }

      .bottom-area {
        padding: 17px 0 20px;
      }

      .bottom-nav {
        width: calc(100% - 32px);
        font-size: 17px;
      }

      .menu-inner {
        width: calc(100% - 32px);
      }

      .menu-list {
        font-size: 25px;
        gap: 25px;
      }
    }
  </style>
</head>

<body>

  <!-- 通常ページ -->
  <div class="page">

    <header>
      <h1 class="site-title">オハザブ日記</h1>

      <button class="menu-button" onclick="openMenu()" aria-label="メニュー">
        <span></span>
        <span></span>
        <span></span>
      </button>
    </header>

    <main>

      <div class="date">
        20261007
      </div>

      <article class="diary">

        <p>
          ここに今日の日記を書く。
        </p>

        <p>
          文章を書いたり、写真を入れたりできます。
        </p>

        <!--
        写真を入れる場合：

        <img src="画像ファイル名.jpg" alt="">
        -->

      </article>

    </main>

  </div>


  <!-- 下部ナビ -->
  <div class="bottom-area">

    <nav class="bottom-nav">

      <a href="20261006.html">
        ←きのう
      </a>

      <a href="20261008.html">
        あした→
      </a>

    </nav>

  </div>


  <!-- メニュー -->
  <div class="menu-screen" id="menuScreen">

    <div class="menu-inner">

      <button
        class="close-button"
        onclick="closeMenu()"
        aria-label="メニューを閉じる">
      </button>

      <nav class="menu-list">

        <a href="index.html">
          きょう
        </a>

        <a href="design.html">
          デザイン
        </a>

        <a href="record.html">
          記録
        </a>

        <a href="profile.html">
          プロフィール
        </a>

      </nav>

    </div>

  </div>


  <script>
    function openMenu() {
      document.getElementById("menuScreen").classList.add("open");
    }

    function closeMenu() {
      document.getElementById("menuScreen").classList.remove("open");
    }
  </script>

</body>
</html>

<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>オハザブ日記</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html {
      background: #ffffff;
    }

    body {
      margin: 0;
      background: #ffffff;
      color: #000000;
      font-family:
        "Yu Gothic",
        "YuGothic",
        "Hiragino Kaku Gothic ProN",
        "Hiragino Sans",
        sans-serif;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    /* 共通の横幅 */
    .site-width {
      width: calc(100% - 40px);
      max-width: 900px;
      margin: 0 auto;
    }

    /* ヘッダー */
    header {
      position: relative;
      padding-top: 40px;
      padding-bottom: 70px;
    }

    .site-title {
      margin: 0;
      color: #003B75;
      font-size: 28px;
      font-weight: 600;
      line-height: 1.4;
      letter-spacing: 0.02em;
    }

    /* ハンバーガーボタン */
    .menu-button {
      position: absolute;
      top: 38px;
      right: 0;
      width: 30px;
      height: 30px;
      padding: 4px 0;
      border: none;
      background: transparent;
      cursor: pointer;

      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .menu-button span {
      display: block;
      width: 30px;
      height: 2px;
      background: #003B75;
      transition: 0.2s ease;
    }

    /* × */
    .menu-button.open {
      justify-content: center;
    }

    .menu-button.open span {
      position: absolute;
    }

    .menu-button.open span:nth-child(1) {
      transform: rotate(45deg);
    }

    .menu-button.open span:nth-child(2) {
      opacity: 0;
    }

    .menu-button.open span:nth-child(3) {
      transform: rotate(-45deg);
    }

    /* メニュー */
    .menu {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 10;
      background: #ffffff;

      align-items: center;
      justify-content: center;
    }

    .menu.open {
      display: flex;
    }

    .menu-list {
      margin: 0;
      padding: 0;
      list-style: none;
      text-align: center;
    }

    .menu-list li {
      margin: 0 0 30px;
    }

    .menu-list li:last-child {
      margin-bottom: 0;
    }

    .menu-list a {
      color: #003B75;
      font-size: 28px;
      font-weight: 600;
      line-height: 1.4;
    }

    /* 日記 */
    main {
      padding-bottom: 160px;
    }

    .date {
      margin: 0 0 45px;
      font-family:
        "Yu Mincho",
        "YuMincho",
        "Hiragino Mincho ProN",
        "Hiragino Mincho Pro",
        serif;

      color: #000000;
      font-size: 23px;
      font-weight: 400;
      line-height: 1.5;
    }

    .entry {
      font-size: 23px;
      font-weight: 400;
      line-height: 2;
    }

    .entry p {
      margin: 0 0 1.5em;
    }

    .entry img {
      display: block;
      width: 100%;
      height: auto;
      margin: 35px 0;
    }

    /* 下部ナビゲーション */
    .day-navigation {
      position: fixed;
      left: 0;
      right: 0;
      bottom: 0;

      background: #ffffff;
      padding: 25px 0 30px;
      z-index: 5;
    }

    .day-navigation-inner {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .day-navigation a {
      color: #003B75;
      font-size: 20px;
      line-height: 1.5;
    }

    @media (max-width: 600px) {
      .site-width {
        width: calc(100% - 30px);
      }

      header {
        padding-top: 25px;
        padding-bottom: 55px;
      }

      .site-title {
        font-size: 24px;
      }

      .menu-button {
        top: 23px;
      }

      .menu-list a {
        font-size: 24px;
      }

      .date,
      .entry {
        font-size: 19px;
      }

      .date {
        margin-bottom: 35px;
      }

      .day-navigation a {
        font-size: 17px;
      }
    }
  </style>
</head>

<body>

  <header class="site-width">

    <h1 class="site-title">オハザブ日記</h1>

    <button
      class="menu-button"
      id="menuButton"
      aria-label="メニューを開く"
      aria-expanded="false"
    >
      <span></span>
      <span></span>
      <span></span>
    </button>

  </header>


  <nav class="menu" id="menu">

    <ul class="menu-list">

      <li>
        <a href="20261007.html">きょう</a>
      </li>

      <li>
        <a href="#">デザイン</a>
      </li>

      <li>
        <a href="#">記録</a>
      </li>

      <li>
        <a href="#">プロフィール</a>
      </li>

    </ul>

  </nav>


  <main class="site-width">

    <div class="date">
      20261007
    </div>

    <article class="entry">

      <p>
        今日の日記。
      </p>

    </article>

  </main>


  <div class="day-navigation">

    <div class="site-width day-navigation-inner">

      <a href="20261006.html">←きのう</a>

      <a href="20261008.html">あした→</a>

    </div>

  </div>


  <script>
    const menuButton = document.getElementById("menuButton");
    const menu = document.getElementById("menu");

    menuButton.addEventListener("click", function () {
      const isOpen = menu.classList.toggle("open");

      menuButton.classList.toggle("open", isOpen);
      menuButton.setAttribute("aria-expanded", isOpen);
    });
  </script>

</body>
</html>

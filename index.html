<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>オハザブ日記</title>

  <style>

    /* =========================
       基本設定
    ========================= */

    * {
      box-sizing: border-box;
    }

    html {
      background: #ffffff;
    }

    body {
      margin: 0;
      min-height: 100vh;

      background: #ffffff;
      color: #000000;

      font-family:
        "Yu Gothic",
        "游ゴシック",
        YuGothic,
        sans-serif;

      font-weight: 400;
    }


    /* =========================
       全体の横幅
       ========================= */

    .page {
      width: min(900px, calc(100% - 48px));
      margin: 0 auto;
    }


    /* =========================
       ヘッダー
    ========================= */

    header {
      position: relative;
      padding-top: 42px;
    }

    .site-title {
      margin: 0;

      color: #003B75;

      font-family:
        "Yu Gothic",
        "游ゴシック",
        YuGothic,
        sans-serif;

      font-size: 28px;
      font-weight: 600;

      line-height: 1.4;
    }


    /* =========================
       メニューボタン
    ========================= */

    .menu-button {
      position: fixed;

      top: 36px;
      right: max(22px, calc((100vw - 900px) / 2));

      z-index: 1001;

      width: 42px;
      height: 42px;

      padding: 0;
      margin: 0;

      border: none;
      outline: none;

      background: transparent;
      color: #003B75;

      cursor: pointer;

      display: flex;
      align-items: center;
      justify-content: center;

      font-family:
        "Yu Gothic",
        "游ゴシック",
        YuGothic,
        sans-serif;

      /*
        大きめだけど細い
      */
      font-size: 35px;
      font-weight: 300;

      line-height: 1;

      appearance: none;
    }

    .menu-button span {
      display: block;

      font-family:
        "Yu Gothic",
        "游ゴシック",
        YuGothic,
        sans-serif;

      font-size: 35px;
      font-weight: 300;

      line-height: 1;

      transform: translateY(-1px);
    }


    /* =========================
       日記本文
    ========================= */

    main {
      /*
        タイトルから日付まで
      */
      padding-top: 78px;

      /*
        下部ナビゲーションと
        本文が重ならないための余白
      */
      padding-bottom: 150px;
    }


    /* =========================
       日付
    ========================= */

    .date {
      margin: 0;

      color: #000000;

      font-family:
        "Yu Mincho",
        "游明朝",
        YuMincho,
        serif;

      font-size: 22px;
      font-weight: 400;

      line-height: 1.4;
    }


    /* =========================
       本文
    ========================= */

    .article {
      /*
        20261007と本文の間を
        しっかり空ける
      */
      margin-top: 42px;

      color: #000000;

      font-family:
        "Yu Gothic",
        "游ゴシック",
        YuGothic,
        sans-serif;

      font-size: 22px;

      /*
        本文は少し細め
      */
      font-weight: 350;

      /*
        文章同士の行間は
        前回より少し狭く
      */
      line-height: 1.45;

      white-space: pre-wrap;
    }


    /* =========================
       下部ナビ用の余白
    ========================= */

    .bottom-space {
      height: 90px;
    }


    /* =========================
       下部ナビゲーション
    ========================= */

    .navigation {
      position: fixed;

      left: 0;
      bottom: 0;

      z-index: 900;

      width: 100%;

      /*
        本文や写真に
        ナビが直接重ならないよう
        白い背景を確保
      */
      padding: 20px 0 28px;

      background: #ffffff;
    }

    .navigation-inner {
      width: min(900px, calc(100% - 48px));

      margin: 0 auto;

      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .navigation a {
      color: #003B75;

      font-family:
        "Yu Gothic",
        "游ゴシック",
        YuGothic,
        sans-serif;

      font-size: 18px;
      font-weight: 400;

      text-decoration: none;
    }

    .navigation a:hover {
      opacity: 0.55;
    }


    /* =========================
       メニュー画面
    ========================= */

    .menu {
      position: fixed;

      inset: 0;

      z-index: 1000;

      display: none;

      align-items: center;
      justify-content: center;

      background: #ffffff;
    }

    .menu.open {
      display: flex;
    }


    /* =========================
       メニュー項目
    ========================= */

    .menu-list {
      display: flex;

      flex-direction: column;
      align-items: center;

      gap: 25px;

      margin: 0;
      padding: 0;

      list-style: none;
    }

    .menu-list a {
      color: #003B75;

      font-family:
        "Yu Gothic",
        "游ゴシック",
        YuGothic,
        sans-serif;

      font-size: 28px;
      font-weight: 500;

      text-decoration: none;
    }

    .menu-list a:hover {
      opacity: 0.55;
    }


    /* =========================
       スマートフォン
    ========================= */

    @media (max-width: 600px) {

      /* 横幅 */

      .page {
        width: calc(100% - 40px);
      }


      /* ヘッダー */

      header {
        padding-top: 30px;
      }

      .site-title {
        font-size: 24px;
      }


      /* メニューボタン */

      .menu-button {
        top: 24px;
        right: 16px;

        width: 44px;
        height: 44px;

        font-size: 34px;
      }

      .menu-button span {
        font-size: 34px;
      }


      /* 本文 */

      main {
        padding-top: 60px;
        padding-bottom: 125px;
      }


      /* 日付 */

      .date {
        font-size: 20px;
        line-height: 1.35;
      }


      /* 本文 */

      .article {
        /*
          スマホでも日付と本文の間は
          しっかり空ける
        */
        margin-top: 38px;

        font-size: 20px;

        /*
          本文同士は詰め気味
        */
        line-height: 1.45;
      }


      /* 下部ナビ */

      .navigation {
        padding: 17px 0 23px;
      }

      .navigation-inner {
        width: calc(100% - 40px);
      }

      .navigation a {
        font-size: 16px;
      }


      /* メニュー */

      .menu-list {
        gap: 22px;
      }

      .menu-list a {
        font-size: 24px;
      }

    }

  </style>

</head>


<body>


  <!-- =========================
       ヘッダー
  ========================== -->

  <header class="page">

    <h1 class="site-title">
      オハザブ日記
    </h1>

  </header>



  <!-- =========================
       メニューボタン
  ========================== -->

  <button
    class="menu-button"
    id="menuButton"
    aria-label="メニューを開く"
    aria-expanded="false"
  >

    <span id="menuIcon">☰</span>

  </button>



  <!-- =========================
       日記本文
  ========================== -->

  <main class="page">


    <!-- 日付 -->

    <div class="date">
      20261007
    </div>


    <!-- 本文 -->

    <div class="article">ここに今日の日記を書きます。

文章をここに追加していってください。

写真を入れる場合も、この本文の中に追加できます。</div>


  </main>



  <!-- =========================
       下部ナビゲーション用の余白
  ========================== -->

  <div class="bottom-space"></div>



  <!-- =========================
       きのう / あした
  ========================== -->

  <nav class="navigation">

    <div class="navigation-inner">

      <a href="20261006.html">
        ←きのう
      </a>

      <a href="20261008.html">
        あした→
      </a>

    </div>

  </nav>



  <!-- =========================
       メニュー画面
  ========================== -->

  <div
    class="menu"
    id="menu"
  >

    <ul class="menu-list">

      <li>
        <a href="index.html">
          きょう
        </a>
      </li>

      <li>
        <a href="design.html">
          デザイン
        </a>
      </li>

      <li>
        <a href="record.html">
          記録
        </a>
      </li>

      <li>
        <a href="profile.html">
          プロフィール
        </a>
      </li>

    </ul>

  </div>



  <!-- =========================
       メニュー開閉
  ========================== -->

  <script>

    const menuButton =
      document.getElementById("menuButton");

    const menuIcon =
      document.getElementById("menuIcon");

    const menu =
      document.getElementById("menu");


    menuButton.addEventListener(
      "click",
      function () {

        const isOpen =
          menu.classList.toggle("open");


        if (isOpen) {

          /* メニューを開く */

          menuIcon.textContent = "×";

          menuButton.setAttribute(
            "aria-expanded",
            "true"
          );

          menuButton.setAttribute(
            "aria-label",
            "メニューを閉じる"
          );


        } else {

          /* メニューを閉じる */

          menuIcon.textContent = "☰";

          menuButton.setAttribute(
            "aria-expanded",
            "false"
          );

          menuButton.setAttribute(
            "aria-label",
            "メニューを開く"
          );

        }

      }
    );

  </script>


</body>
</html>

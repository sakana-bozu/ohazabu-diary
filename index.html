<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>オハザブ日記</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html {
      min-height: 100%;
      background: #ffffff;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: #ffffff;
      color: #000000;
      font-family: "Yu Gothic", "游ゴシック", YuGothic, sans-serif;
      font-weight: 400;
    }

    /* 全ページ共通の横幅 */
    .page {
      width: min(900px, calc(100% - 48px));
      margin: 0 auto;
      position: relative;
    }

    /* ヘッダー */
    header {
      position: relative;
      padding-top: 42px;
    }

    .site-title {
      margin: 0;
      color: #003B75;
      font-family: "Yu Gothic", "游ゴシック", YuGothic, sans-serif;
      font-size: 28px;
      font-weight: 600;
      line-height: 1.4;
    }

    /* メニューボタン */
    .menu-button {
      position: fixed;
      top: 40px;
      right: max(24px, calc((100vw - 900px) / 2));
      z-index: 1001;

      width: 36px;
      height: 36px;
      padding: 0;

      border: none;
      background: transparent;
      color: #003B75;

      font-family: "Yu Gothic", "游ゴシック", YuGothic, sans-serif;
      font-size: 28px;
      font-weight: 400;
      line-height: 36px;

      cursor: pointer;
    }

    .menu-button span {
      display: block;
      line-height: 32px;
    }

    /* 日記 */
    main {
      padding-top: 85px;
      padding-bottom: 150px;
    }

    .date {
      margin: 0 0 26px 0;

      color: #000000;
      font-family: "Yu Mincho", "游明朝", YuMincho, serif;
      font-size: 23px;
      font-weight: 400;
      line-height: 1.5;
    }

    .article {
      color: #000000;
      font-family: "Yu Gothic", "游ゴシック", YuGothic, sans-serif;
      font-size: 23px;
      font-weight: 350;
      line-height: 2;

      white-space: pre-wrap;
    }

    /* 下部ナビゲーション */
    .bottom-space {
      height: 90px;
    }

    .navigation {
      position: fixed;
      left: 0;
      bottom: 0;
      z-index: 900;

      width: 100%;
      padding: 22px 0 28px;

      background: #ffffff;
    }

    .navigation-inner {
      width: min(900px, calc(100% - 48px));
      margin: 0 auto;

      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .navigation a {
      color: #003B75;
      font-family: "Yu Gothic", "游ゴシック", YuGothic, sans-serif;
      font-size: 18px;
      font-weight: 400;
      text-decoration: none;
    }

    .navigation a:hover {
      opacity: 0.6;
    }

    /* メニュー */
    .menu {
      position: fixed;
      inset: 0;
      z-index: 1000;

      display: none;
      align-items: center;
      justify-content: center;

      background: #ffffff;
    }

    .menu.open {
      display: flex;
    }

    .menu-list {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 34px;

      margin: 0;
      padding: 0;

      list-style: none;
    }

    .menu-list a {
      color: #003B75;
      font-family: "Yu Gothic", "游ゴシック", YuGothic, sans-serif;
      font-size: 28px;
      font-weight: 500;
      text-decoration: none;
    }

    .menu-list a:hover {
      opacity: 0.6;
    }

    /* スマホ */
    @media (max-width: 600px) {

      .page {
        width: calc(100% - 40px);
      }

      header {
        padding-top: 30px;
      }

      .site-title {
        font-size: 24px;
      }

      .menu-button {
        top: 28px;
        right: 20px;
        font-size: 26px;
      }

      main {
        padding-top: 65px;
        padding-bottom: 130px;
      }

      .date {
        font-size: 20px;
        margin-bottom: 22px;
      }

      .article {
        font-size: 20px;
        line-height: 1.9;
      }

      .navigation {
        padding: 18px 0 24px;
      }

      .navigation-inner {
        width: calc(100% - 40px);
      }

      .navigation a {
        font-size: 16px;
      }

      .menu-list a {
        font-size: 24px;
      }
    }
  </style>
</head>

<body>

  <!-- ヘッダー -->
  <header class="page">
    <h1 class="site-title">オハザブ日記</h1>
  </header>

  <!-- メニューボタン -->
  <button
    class="menu-button"
    id="menuButton"
    aria-label="メニューを開く"
    aria-expanded="false"
  >
    <span id="menuIcon">☰</span>
  </button>

  <!-- 日記本文 -->
  <main class="page">

    <div class="date">20261007</div>

    <div class="article">ここに今日の日記を書きます。

文章をここに追加していってください。

写真を入れる場合も、この本文の中に追加できます。</div>

  </main>

  <!-- 下部ナビが本文に被らないための余白 -->
  <div class="bottom-space"></div>

  <!-- 前後の日記 -->
  <nav class="navigation">
    <div class="navigation-inner">
      <a href="20261006.html">←きのう</a>
      <a href="20261008.html">あした→</a>
    </div>
  </nav>

  <!-- メニュー -->
  <div class="menu" id="menu">

    <ul class="menu-list">
      <li>
        <a href="index.html">きょう</a>
      </li>

      <li>
        <a href="design.html">デザイン</a>
      </li>

      <li>
        <a href="record.html">記録</a>
      </li>

      <li>
        <a href="profile.html">プロフィール</a>
      </li>
    </ul>

  </div>

  <script>
    const menuButton = document.getElementById("menuButton");
    const menuIcon = document.getElementById("menuIcon");
    const menu = document.getElementById("menu");

    menuButton.addEventListener("click", function () {

      const isOpen = menu.classList.toggle("open");

      if (isOpen) {
        menuIcon.textContent = "×";
        menuButton.setAttribute("aria-expanded", "true");
        menuButton.setAttribute("aria-label", "メニューを閉じる");
      } else {
        menuIcon.textContent = "☰";
        menuButton.setAttribute("aria-expanded", "false");
        menuButton.setAttribute("aria-label", "メニューを開く");
      }

    });
  </script>

</body>
</html>

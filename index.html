<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>オハザブ日記</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html {
      background: #ffffff;
    }

    body {
      margin: 0;
      background: #ffffff;
      color: #000000;
      font-family: "Yu Gothic", "游ゴシック", YuGothic, sans-serif;
    }

    .page {
      width: min(900px, calc(100% - 48px));
      margin: 0 auto;
    }

    /* =========================
       上部固定ヘッダー
       ========================= */

    header {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100px;
      z-index: 20;

      background: #ffffff;

      pointer-events: none;
    }

    .header-inner {
      width: min(900px, calc(100% - 48px));
      height: 100%;
      margin: 0 auto;

      padding-top: 36px;
    }

    .site-title {
      margin: 0;

      color: #003B75;

      font-family:
        "Yu Gothic",
        "游ゴシック",
        YuGothic,
        sans-serif;

      font-size: 28px;
      font-weight: 600;
      line-height: 1;
    }

    /* =========================
       メニューボタン
       ========================= */

    .menu-button {
      position: fixed;
      top: 28px;
      right: max(24px, calc((100vw - 900px) / 2));
      z-index: 40;

      border: none;
      background: transparent;
      color: #003B75;

      font-family:
        "Yu Gothic",
        "游ゴシック",
        YuGothic,
        sans-serif;

      font-size: 35px;
      font-weight: 300;
      line-height: 1;

      padding: 0;
      cursor: pointer;
    }

    /* =========================
       本文
       ========================= */

    main {
      padding-top: 120px;
      padding-bottom: 150px;
    }

    .date {
      margin: 0 0 42px 0;

      color: #000000;

      font-family:
        "Yu Mincho",
        "游明朝",
        YuMincho,
        serif;

      font-size: 22px;
      font-weight: 400;
      line-height: 1;
    }

    article {
      color: #000000;

      font-family:
        "Yu Gothic",
        "游ゴシック",
        YuGothic,
        sans-serif;

      font-size: 22px;
      font-weight: 350;
      line-height: 1.45;

      white-space: pre-wrap;
    }

    /* =========================
       下部ナビ
       ========================= */

    .bottom-nav {
      position: fixed;
      left: 0;
      bottom: 0;
      width: 100%;
      z-index: 20;

      background: #ffffff;

      padding: 20px 0 28px;
    }

    .bottom-nav-inner {
      width: min(900px, calc(100% - 48px));
      margin: 0 auto;

      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .nav-link {
      display: flex;
      align-items: center;
      gap: 9px;

      color: #003B75;
      text-decoration: none;

      font-family:
        "Yu Gothic",
        "游ゴシック",
        YuGothic,
        sans-serif;

      font-size: 18px;
      font-weight: 600;
      line-height: 1;
    }

    /* =========================
       左矢印
       ========================= */

    .arrow {
      position: relative;

      display: inline-block;

      width: 22px;
      height: 14px;
    }

    .arrow-left::before {
      content: "";

      position: absolute;
      left: 0;
      top: 6px;

      width: 22px;
      height: 2px;

      background: #003B75;
    }

    .arrow-left::after {
      content: "";

      position: absolute;
      left: 0;
      top: 2px;

      width: 9px;
      height: 9px;

      border-left: 2px solid #003B75;
      border-bottom: 2px solid #003B75;

      transform: rotate(45deg);
    }

    /* =========================
       右矢印
       ========================= */

    .arrow-right::before {
      content: "";

      position: absolute;
      left: 0;
      top: 6px;

      width: 22px;
      height: 2px;

      background: #003B75;
    }

    .arrow-right::after {
      content: "";

      position: absolute;
      right: 0;
      top: 2px;

      width: 9px;
      height: 9px;

      border-right: 2px solid #003B75;
      border-top: 2px solid #003B75;

      transform: rotate(45deg);
    }

    /* =========================
       メニュー
       ========================= */

    .menu {
      position: fixed;
      inset: 0;
      z-index: 30;

      display: flex;
      justify-content: center;
      align-items: center;

      background: #ffffff;

      opacity: 0;
      visibility: hidden;
      pointer-events: none;

      transition: opacity 0.2s ease;
    }

    .menu.open {
      opacity: 1;
      visibility: visible;
      pointer-events: auto;
    }

    .menu-list {
      display: flex;
      flex-direction: column;
      align-items: center;

      gap: 28px;
    }

    .menu-list a {
      color: #003B75;
      text-decoration: none;

      font-family:
        "Yu Gothic",
        "游ゴシック",
        YuGothic,
        sans-serif;

      font-size: 28px;
      font-weight: 500;
    }

    /* =========================
       スマホ
       ========================= */

    @media (max-width: 600px) {

      .page {
        width: calc(100% - 40px);
      }

      .header-inner {
        width: calc(100% - 40px);

        padding-top: 30px;
      }

      header {
        height: 85px;
      }

      .site-title {
        font-size: 28px;
      }

      .menu-button {
        top: 23px;
        right: 20px;

        font-size: 35px;
      }

      main {
        padding-top: 105px;
        padding-bottom: 140px;
      }

      .date {
        margin-bottom: 34px;

        font-size: 20px;
      }

      article {
        font-size: 20px;
        line-height: 1.45;
      }

      .bottom-nav {
        padding: 18px 0 24px;
      }

      .bottom-nav-inner {
        width: calc(100% - 40px);
      }

      .nav-link {
        font-size: 17px;
      }

      .menu-list {
        gap: 24px;
      }

      .menu-list a {
        font-size: 24px;
      }
    }
  </style>
</head>

<body>

  <!-- =========================
       上部
       ========================= -->

  <header>
    <div class="header-inner">
      <h1 class="site-title">オハザブ日記</h1>
    </div>
  </header>

  <!-- =========================
       メニューボタン
       ========================= -->

  <button
    class="menu-button"
    id="menuButton"
    aria-label="メニューを開く"
    aria-expanded="false"
  >☰</button>

  <!-- =========================
       メニュー
       ========================= -->

  <nav class="menu" id="menu">

    <div class="menu-list">

      <a href="index.html">きょう</a>

      <a href="design.html">デザイン</a>

      <a href="record.html">記録</a>

      <a href="profile.html">プロフィール</a>

    </div>

  </nav>

  <!-- =========================
       本文
       ========================= -->

  <main class="page">

    <div class="date" id="date">
      読み込み中
    </div>

    <article id="article">
      読み込み中
    </article>

  </main>

  <!-- =========================
       下部ナビ
       ========================= -->

  <nav class="bottom-nav">

    <div class="bottom-nav-inner">

      <a
        class="nav-link"
        id="yesterday"
        href="#"
      >
        <span class="arrow arrow-left"></span>
        <span>きのう</span>
      </a>

      <a
        class="nav-link"
        id="tomorrow"
        href="#"
      >
        <span>あした</span>
        <span class="arrow arrow-right"></span>
      </a>

    </div>

  </nav>

  <!-- =========================
       JavaScript
       ========================= -->

  <script>

    /* メニュー */

    const menuButton =
      document.getElementById("menuButton");

    const menu =
      document.getElementById("menu");

    menuButton.addEventListener("click", () => {

      const isOpen =
        menu.classList.toggle("open");

      menuButton.textContent =
        isOpen ? "×" : "☰";

      menuButton.setAttribute(
        "aria-expanded",
        isOpen
      );

      menuButton.setAttribute(
        "aria-label",
        isOpen
          ? "メニューを閉じる"
          : "メニューを開く"
      );

    });


    /* 最新の日記を読み込む */

    async function loadLatestDiary() {

      const apiUrl =
        "https://api.github.com/repos/sakana-bozu/ohazabu-diary/contents/";

      try {

        const response =
          await fetch(
            apiUrl + "?t=" + Date.now()
          );

        if (!response.ok) {
          throw new Error(
            "GitHub API error"
          );
        }

        const files =
          await response.json();


        /* 8桁の日付.htmlだけを取得 */

        const diaryFiles =
          files
            .filter(
              file =>
                /^\d{8}\.html$/.test(
                  file.name
                )
            )
            .sort(
              (a, b) =>
                b.name.localeCompare(
                  a.name
                )
            );


        if (diaryFiles.length === 0) {

          throw new Error(
            "日記ファイルがありません"
          );

        }


        /* 一番新しい日記 */

        const latest =
          diaryFiles[0];

        const latestDate =
          latest.name.replace(
            ".html",
            ""
          );


        /* 日記ファイルを取得 */

        const rawUrl =
          "https://raw.githubusercontent.com/sakana-bozu/ohazabu-diary/main/" +
          latest.name;

        const diaryResponse =
          await fetch(
            rawUrl + "?t=" + Date.now()
          );


        if (!diaryResponse.ok) {

          throw new Error(
            "日記ファイルを取得できません"
          );

        }


        const html =
          await diaryResponse.text();


        const parser =
          new DOMParser();

        const doc =
          parser.parseFromString(
            html,
            "text/html"
          );


        const date =
          doc.querySelector(".date");

        const article =
          doc.querySelector("article");


        if (!date || !article) {

          throw new Error(
            "日記の形式が正しくありません"
          );

        }


        /* 日付 */

        document
          .getElementById("date")
          .textContent =
            date.textContent;


        /* 本文 */

        document
          .getElementById("article")
          .textContent =
            article.textContent;


        /* 日付をDateに変換 */

        const year =
          Number(
            latestDate.slice(0, 4)
          );

        const month =
          Number(
            latestDate.slice(4, 6)
          ) - 1;

        const day =
          Number(
            latestDate.slice(6, 8)
          );


        const current =
          new Date(
            year,
            month,
            day
          );


        /* きのう */

        const yesterday =
          new Date(current);

        yesterday.setDate(
          current.getDate() - 1
        );


        /* あした */

        const tomorrow =
          new Date(current);

        tomorrow.setDate(
          current.getDate() + 1
        );


        /* 日付をファイル名にする */

        function formatDate(date) {

          const y =
            date.getFullYear();

          const m =
            String(
              date.getMonth() + 1
            ).padStart(2, "0");

          const d =
            String(
              date.getDate()
            ).padStart(2, "0");

          return `${y}${m}${d}.html`;

        }


        document
          .getElementById("yesterday")
          .href =
            formatDate(yesterday);


        document
          .getElementById("tomorrow")
          .href =
            formatDate(tomorrow);

      }

      catch (error) {

        console.error(error);

        document
          .getElementById("date")
          .textContent = "";

        document
          .getElementById("article")
          .textContent =
            "日記を読み込めませんでした。";

      }

    }


    loadLatestDiary();

  </script>

</body>
</html>

<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>オハザブ日記</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      background: #ffffff;
      color: #000000;
    }

    body {
      font-family: "Yu Gothic", "游ゴシック", YuGothic, sans-serif;
      font-size: 16px;
      line-height: 1.9;
    }

    /* --------------------------------
       共通
    -------------------------------- */

    .page {
      min-height: 100vh;
      position: relative;
      padding: 42px 6vw 150px;
    }

    .content {
      width: 100%;
      max-width: 760px;
      margin: 0;
    }

    /* --------------------------------
       ヘッダー
    -------------------------------- */

    .site-title {
      margin: 0 0 48px;
      color: #003B75;
      font-family: "Yu Gothic", "游ゴシック", YuGothic, sans-serif;
      font-size: 25px;
      font-weight: 600;
      line-height: 1.4;
      letter-spacing: 0.02em;
    }

    /* --------------------------------
       メニューボタン
    -------------------------------- */

    .menu-button {
      position: fixed;
      top: 39px;
      right: 6vw;
      z-index: 1001;

      width: 32px;
      height: 32px;
      padding: 0;
      border: none;
      background: transparent;
      color: #003B75;

      font-family: "Yu Gothic", "游ゴシック", YuGothic, sans-serif;
      font-size: 25px;
      font-weight: 500;
      line-height: 32px;

      cursor: pointer;
    }

    .menu-button:hover {
      opacity: 0.65;
    }

    /* --------------------------------
       日記
    -------------------------------- */

    .date {
      margin: 0 0 30px;

      color: #000000;
      font-family: "Yu Mincho", "游明朝", YuMincho, serif;
      font-size: 21px;
      font-weight: 400;
      line-height: 1.5;
    }

    .article {
      color: #000000;
      font-family: "Yu Gothic", "游ゴシック", YuGothic, sans-serif;
      font-size: 21px;
      font-weight: 400;
      line-height: 2;

      white-space: pre-wrap;
      word-break: break-word;
    }

    .article img {
      display: block;
      max-width: 100%;
      height: auto;
      margin: 35px 0;
    }

    /* --------------------------------
       下部ナビゲーション
    -------------------------------- */

    .bottom-space {
      height: 130px;
    }

    .navigation {
      display: flex;
      justify-content: space-between;
      align-items: center;

      width: 100%;

      color: #003B75;
      font-family: "Yu Gothic", "游ゴシック", YuGothic, sans-serif;
      font-size: 17px;
      font-weight: 500;
    }

    .navigation a {
      color: #003B75;
      text-decoration: none;
    }

    .navigation a:hover {
      opacity: 0.6;
    }

    /* --------------------------------
       メニュー画面
    -------------------------------- */

    .menu-overlay {
      position: fixed;
      inset: 0;
      z-index: 1000;

      display: flex;
      align-items: center;
      justify-content: center;

      background: #ffffff;

      opacity: 0;
      visibility: hidden;
      pointer-events: none;

      transition:
        opacity 0.2s ease,
        visibility 0.2s ease;
    }

    .menu-overlay.open {
      opacity: 1;
      visibility: visible;
      pointer-events: auto;
    }

    .menu-list {
      display: flex;
      flex-direction: column;
      align-items: center;

      gap: 25px;

      margin: 0;
      padding: 0;

      list-style: none;
    }

    .menu-list a {
      color: #003B75;
      font-family: "Yu Gothic", "游ゴシック", YuGothic, sans-serif;
      font-size: 25px;
      font-weight: 500;
      line-height: 1.5;

      text-decoration: none;
    }

    .menu-list a:hover {
      opacity: 0.6;
    }

    /* --------------------------------
       スマートフォン
    -------------------------------- */

    @media (max-width: 600px) {

      .page {
        padding: 30px 24px 130px;
      }

      .site-title {
        margin-bottom: 42px;
        font-size: 22px;
      }

      .menu-button {
        top: 27px;
        right: 24px;
        font-size: 23px;
      }

      .date {
        margin-bottom: 25px;
        font-size: 18px;
      }

      .article {
        font-size: 18px;
        line-height: 2;
      }

      .navigation {
        font-size: 16px;
      }

      .menu-list a {
        font-size: 22px;
      }
    }
  </style>
</head>

<body>

  <!-- メインページ -->
  <div class="page">

    <div class="content">

      <h1 class="site-title">オハザブ日記</h1>

      <main>

        <div class="date">20261007</div>

        <div class="article">
ここに20261007の日記を書く。

文章を書いていくと、
このようにそのまま表示されます。

写真を入れる場合は、
あとから<img>タグを入れることもできます。
        </div>

        <!-- 本文とナビゲーションが重ならないための余白 -->
        <div class="bottom-space"></div>

        <nav class="navigation">
          <a href="20261006.html">←きのう</a>
          <a href="20261008.html">あした→</a>
        </nav>

      </main>

    </div>

  </div>


  <!-- メニュー -->
  <div class="menu-overlay" id="menuOverlay">

    <nav>
      <ul class="menu-list">

        <li>
          <a href="20261007.html">きょう</a>
        </li>

        <li>
          <a href="#">デザイン</a>
        </li>

        <li>
          <a href="#">記録</a>
        </li>

        <li>
          <a href="#">プロフィール</a>
        </li>

      </ul>
    </nav>

  </div>


  <!-- メニューボタン -->
  <button
    class="menu-button"
    id="menuButton"
    type="button"
    aria-label="メニュー"
    aria-expanded="false"
  >☰</button>


  <script>
    const menuButton = document.getElementById("menuButton");
    const menuOverlay = document.getElementById("menuOverlay");

    menuButton.addEventListener("click", function () {

      const isOpen = menuOverlay.classList.toggle("open");

      if (isOpen) {
        menuButton.textContent = "×";
        menuButton.setAttribute("aria-expanded", "true");
      } else {
        menuButton.textContent = "☰";
        menuButton.setAttribute("aria-expanded", "false");
      }

    });
  </script>

</body>
</html>
